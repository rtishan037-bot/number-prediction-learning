
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Analyzer 3.0</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}
h1 {color:#00e5ff;}
textarea {
  width:90%;
  height:100px;
  padding:12px;
  border-radius:10px;
  font-size:16px;
}
button {
  background:#00bcd4;
  padding:13px 22px;
  border:0;
  border-radius:10px;
  margin:10px;
  font-size:16px;
}
#result {
  background:#202f43;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:left;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<h1>Number Analyzer 3.0</h1>
<p>Enter your previous numbers</p>

<textarea id="numbers"
placeholder="Example: 12, 45, 23, 12, 67"></textarea>

<br>
<button onclick="analyze()">Analyze Numbers</button>

<div id="result">
<h3>Analysis Result</h3>
Your result will appear here.
</div>

<script>
function analyze() {
 const input = document.getElementById("numbers").value;

 const nums = input.split(/[\s,]+/)
 .filter(x => x.trim() !== "")
 .map(Number);

 if(nums.length < 2 || nums.some(x => !Number.isFinite(x))) {
   document.getElementById("result").innerHTML =
   "Please enter at least 2 valid numbers.";
   return;
 }

 let freq = {};
 nums.forEach(n => freq[n] = (freq[n] || 0) + 1);

 let even = nums.filter(n => n % 2 === 0).length;
 let odd = nums.length - even;

 let sorted = [...nums].sort((a,b) => b[1]-a[1]);

 let highest = Math.max(...nums);
 let lowest = Math.min(...nums);
 let average = nums.reduce((a,b)=>a+b,0)/nums.length;

 let repeated = Object.entries(freq)
 .filter(([n,c]) => c > 1)
 .map(([n,c]) => `${n} (${c} times)`);

 let trend = nums[nums.length-1] > nums[0]
 ? "Overall upward"
 : nums[nums.length-1] < nums[0]
 ? "Overall downward" : "No net change";

 document.getElementById("result").innerHTML = `
 <h3>Analysis Result</h3>
 Total Numbers: ${nums.length}<hr>
 Average: ${average.toFixed(2)}<hr>
 Highest: ${highest}<hr>
 Lowest: ${lowest}<hr>
 Even Numbers: ${even}<hr>
 Odd Numbers: ${odd}<hr>
 Trend: ${trend}<hr>
 Repeated Numbers:
 ${repeated.length ? repeated.join(", ") : "None"}<hr>
 Frequency:<br>
 ${Object.entries(freq).map(([n,c]) =>
 `${n} = ${c} times`).join("<br>")}
 <hr>
 <small>This is statistical analysis, not a guaranteed prediction.</small>
 `;
}
</script>

</body>
</html>
