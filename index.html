
<!DOCTYPE html>
<html>
<head>
    <title>Number Learning</title>
    <style>
        body {
            background: #101827;
            color: white;
            text-align: center;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #00e5ff;
        }

        button {
            background: #00bcd4;
            color: black;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
        }

        #result {
            font-size: 40px;
            color: #00ff99;
            margin: 30px;
        }
    </style>
</head>

<body>

    <h1>Number Learning</h1>

    <p>Learn numbers and probability!</p>

    <button onclick="generateNumber()">
        Generate Number
    </button>

    <div id="result">?</div>

    <script>
        function generateNumber() {
            let number = Math.floor(Math.random() * 10);
            document.getElementById("result").innerText = number;
        }
    </script>

</body>
  </html>
